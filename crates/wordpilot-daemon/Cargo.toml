[package]
name = "wordpilot-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The WordPilot daemon, its diagnostic CLI and a test input client."

[[bin]]
name = "wordpilot-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "wordpilot"
path = "src/bin/cli.rs"

[[bin]]
name = "wordpilot-test-client"
path = "src/bin/test_client.rs"

[dependencies]
wordpilot-core = { workspace = true }
wordpilot-dictionary = { workspace = true }
wordpilot-ranking = { workspace = true }
wordpilot-autocomplete = { workspace = true }
wordpilot-protocol = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
